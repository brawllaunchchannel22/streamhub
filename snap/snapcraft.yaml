name: streamhub
base: core22
version: '3.0.4'
summary: Moderne Mediathek-App für deutsche Sender
description: |
  StreamHub ist deine zentrale Plattform für Inhalte der deutschen
  öffentlich-rechtlichen Mediatheken (ARD, ZDF, Arte, 3Sat und mehr).

grade: stable
confinement: strict

icon: build/icon.png

architectures:
  - build-on: amd64

apps:
  streamhub:
    command: opt/streamhub/streamhub --no-sandbox
    extensions: [gnome]
    plugs:
      - network
      - network-status
      - audio-playback
      - opengl
      - x11
      - wayland

parts:
  streamhub:
    plugin: nil
    source: .
    build-snaps:
      - node/20/stable
    override-build: |
      npm install --legacy-peer-deps
      npx electron-builder --linux --dir
      mkdir -p $CRAFT_PART_INSTALL/opt/streamhub
      cp -r dist/linux-unpacked/* $CRAFT_PART_INSTALL/opt/streamhub/


