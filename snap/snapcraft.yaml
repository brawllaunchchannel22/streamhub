name: streamhub
base: core22
version: '3.0.5'
summary: Moderne Mediathek-App für deutsche Sender
description: |
  StreamHub ist deine zentrale Plattform für Inhalte der deutschen
  öffentlich-rechtlichen Mediatheken (ARD, ZDF, Arte, 3Sat und mehr).

grade: stable
confinement: strict

icon: snap/gui/icon.png

architectures:
  - build-on: amd64

apps:
  streamhub:
    command: opt/streamhub/streamhub --no-sandbox --disable-dev-shm-usage
    desktop: snap/gui/streamhub.desktop
    extensions: [gnome]
    plugs:
      - network
      - network-status
      - audio-playback
      - opengl
      - x11
      - wayland
      - browser-support

parts:
  streamhub:
    plugin: nil
    source: .
    build-snaps:
      - node/20/stable
    override-pull: |
      craftctl default || snapcraftctl default || true
      npm install --legacy-peer-deps
      npx electron-builder --linux --dir
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/opt/streamhub
      cp -r dist/linux-unpacked/* $CRAFT_PART_INSTALL/opt/streamhub/
