name: Publish Snap

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build

      - name: Install craft-store
        run: pip3 install craft-store keyrings.alt

      - name: Upload and Release Snap via craft-store
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring python3 -c "
          import os, json, base64, keyring, pathlib, requests

          raw_creds = os.environ['SNAPCRAFT_STORE_CREDENTIALS']
          try:
              macaroon = json.loads(base64.b64decode(raw_creds))['v']
          except Exception:
              macaroon = raw_creds

          headers = {'Authorization': f'Macaroon {macaroon}', 'Accept': 'application/json'}
          snap_file = os.environ['SNAP_FILE']
          print(f'1. Uploading {snap_file}...')

          with open(snap_file, 'rb') as f:
              files = {'binary': (os.path.basename(snap_file), f, 'application/octet-stream')}
              r = requests.post('https://dashboard.snapcraft.io/api/v2/snaps/streamhub/binary-metadata/', headers=headers)
              print('Metadata check:', r.status_code)

          from craft_store import StoreClient, endpoints
          try:
              valid_creds = json.dumps({'t': 'macaroon', 'v': macaroon})
              valid_b64 = base64.b64encode(valid_creds.encode('utf-8')).decode('utf-8')
          except Exception:
              valid_b64 = raw_creds

          keyring.set_password('snapcraft', 'dashboard.snapcraft.io', valid_b64)
          client = StoreClient(
              base_url='https://dashboard.snapcraft.io',
              storage_base_url='https://storage.snapcraftcontent.com',
              endpoints=endpoints.U1_SNAP_STORE,
              user_agent='snapcraft/8.0',
              application_name='snapcraft',
          )

          snap_path = pathlib.Path(snap_file)
          upload_id = client.upload_file(filepath=snap_path)
          print(f'Upload ID: {upload_id}')

          # Push registration directly to V2 API
          url = f'https://dashboard.snapcraft.io/api/v2/snaps/streamhub/push'
          body = {'upload_id': upload_id}
          r_push = requests.post(url, headers=headers, json=body)
          print('Push Status:', r_push.status_code, r_push.text)
          "
