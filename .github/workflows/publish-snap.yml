name: Publish Snap

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build

      - name: Install upload dependencies
        run: pip3 install craft-store keyrings.alt

      - name: Upload Snap via Store API
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          PYTHON_KEYRING_BACKEND=keyrings.alt.file.PlaintextKeyring python3 -c "
          import keyring, os, sys
          from craft_store import StoreClient, endpoints

          creds = os.environ['SNAPCRAFT_STORE_CREDENTIALS']
          keyring.set_password('snapcraft', 'dashboard.snapcraft.io', creds)

          snap_file = os.environ['SNAP_FILE']
          print(f'Uploading {snap_file} to Snap Store...')

          client = StoreClient(
              base_url='https://dashboard.snapcraft.io',
              storage_base_url='https://storage.snapcraftcontent.com',
              endpoints=endpoints.SNAP_STORE,
              user_agent='snapcraft/8.0',
              application_name='snapcraft',
          )
          
          res = client.upload_file(snap_name='streamhub', filepath=snap_file, channels=['stable'])
          print('Upload erfolgreich!', res)
          "
