name: Publish Snap

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Electron app
        run: npm run build -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build

      - name: Publish Snap
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/snapcraft
          python3 -c "
          import os, json, base64
          raw = os.environ['SNAPCRAFT_STORE_CREDENTIALS']
          try:
              creds = base64.b64decode(raw).decode('utf-8')
          except Exception:
              creds = raw
          with open(os.path.expanduser('~/.config/snapcraft/credentials.txt'), 'w') as f:
              f.write(creds)
          "
          snapcraft upload --release=stable ${{ steps.build.outputs.snap }}
